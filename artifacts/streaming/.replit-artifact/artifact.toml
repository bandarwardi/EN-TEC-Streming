kind = "mobile"
previewPath = "/"
title = "EN TEC Streaming"
version = "1.0.0"
id = "artifacts/en-tec-streaming"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25128

[services.development]
run = "bash -c 'cd /home/runner/workspace/artifacts/streaming && node_modules/.bin/expo start -c --port 25128 --web'"

[services.production]
build = [ "pnpm", "--filter", "@workspace/streaming", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/streaming", "run", "serve" ]

[services.env]
PORT = "25128"
BASE_PATH = "/"
